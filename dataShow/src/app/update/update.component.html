<div class="text-center">
<!-- <h3>Update your Information {{student.id}}</h3> -->
</div>
<div class="container bg-dark-subtle my-3">
    <form class=" " >
        <div class="mb-3">
          <label for="id" class="form-label">Id:</label>
          <input type="text" class="form-control" id="id" name="id" [(ngModel)]="student.id">
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input type="text" class="form-control" id="name" name="name" [(ngModel)]="student.name">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="text" class="form-control" id="email" name="email" [(ngModel)]="student.email">
          </div>
          <div class="mb-3">
            <label for="round" class="form-label">Round:</label>
            <input type="text" class="form-control" id="round" name="round" [(ngModel)]="student.round">
          </div>
        <div class="text-center">
        <button type="submit" class="btn btn-outline-primary" (click)="updateData()">Update</button>
      </div>
      </form>
    </div>
